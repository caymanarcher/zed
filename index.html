<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Where “eyeball it” is an instruction.">
		<title>The Gray Area Kitchen</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap">
		<link rel="stylesheet" href="css/styles.css">
		<script src="js/app.js" defer></script>
	</head>
	<body>
		<header class="site-header">
			<h1>The Gray Area Kitchen</h1>
			<p class="tagline">Where “eyeball it” is an instruction.</p>
		</header>

		<main>
			<section class="legend" aria-labelledby="legend-title">
				<h2 id="legend-title">How much gray area is there?</h2>
				<ul class="legend-list">
					<li><span class="gray-badge gray-exact">Exact</span> Measure carefully</li>
					<li><span class="gray-badge gray-some">Some gray area</span> Adjust if you want</li>
					<li><span class="gray-badge gray-very">Lots of gray area</span> Do whatever your heart desires!</li>
				</ul>
			</section>

			<section id="list-view" aria-label="Recipes">
				<div class="filters">
					<label for="search-input" class="search-label">Search recipes</label>
					<input id="search-input" class="search-input" type="search" placeholder="Try “latte” or “pasta”" autocomplete="off">

					<div class="category-buttons" role="group" aria-label="Filter by category">
						<button type="button" class="category-button" data-category="all" aria-pressed="true">All</button>
						<button type="button" class="category-button" data-category="drinks" aria-pressed="false">Drinks</button>
						<button type="button" class="category-button" data-category="desserts" aria-pressed="false">Desserts</button>
						<button type="button" class="category-button" data-category="meals" aria-pressed="false">Meals</button>
					</div>
				</div>

				<p id="status-message" class="status-message" role="status" hidden></p>
				<ul id="recipe-list" class="recipe-list"></ul>
			</section>

			<section id="detail-view" class="detail-view" hidden></section>
		</main>
	</body>
</html>
